<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2> Donor Information </h2>
    <table>
        <tr>
            <td><label for=" first name"> First Name*</label>

            <td><input type="text" id=" first name" required></td>
            </td>
        </tr>
        <tr>
            <td><label for="last name"> Last Name*</label></td>

            <td><input type="text" id="last name" required></td>
        </tr>
        <tr>
            <td><label for="address1"> Address 1*</label></td>

            <td><input type="text" id="address1" required></td>
        </tr>
        <tr>
            <td><label for="address2"> Address 2</label></td>

            <td><input type="text" id="address2" required></td>
        </tr>
        <tr>
            <td><label for="city"> City*</label></td>

            <td><input type="text" id="city" required></td>
        </tr>
        <tr>
            <td><label for="state"> State* </label></td>
            <td>
                <select name="state" id="state">
                    <option>Select a state</option>
                    <option>Dhaka</option>
                    <option>Rajshahi</option>
                    <option>Rangpur</option>
                    required
                </select>
            </td>
        </tr>
        <tr>
            <td><label for="zip code"> Zip Code*</label></td>

            <td><input type="number" id="zip code" required></td>
        </tr>
        <tr>
            <td><label for="country"> Country* </label></td>
            <td>
                <select name="country" id="country">
                    <option>Select a country</option>
                    <option>Bangladesh</option>
                    <option>India</option>
                    <option>Uk</option>
                    required
                </select>
            </td>
        </tr>
        <tr>
            <td><label for="phone"> Phone*</label></td>

            <td><input type="tel" id="phone" required></td>
        </tr>
        <tr>
            <td><label for="fax"> Fax</label></td>

            <td><input type="txt" id="fax" required></td>
        </tr>
        <tr>
            <td><label for="email"> Email*</label></td>

            <td><input type="text" id="email" required></td>
        </tr>
        tr>
        <td><label for="donation amount"> Donation amount*</label><br>
            (check a button or type in your amount)
        <td>
            <input type="radio" name="donation amount" value="none"> None
            <input type="radio" name="donation amount" value="$50"> $50
            <input type="radio" name="donation amount" value="$75"> $75
            <input type="radio" name="donation amount" value="$100"> $100
            <input type="radio" name="donation amount" value="other"> Other
        </td>
        </tr>
        <tr>
            <td></td>
            <td><label for="others amount"> Others amount$</label>

                <input type="text" id="others amount" required>
            </td>

        </tr>
        <tr>
            <td><label>recuring donation</label><br>
                (check if Yes)
            <td>
                <input type="checkbox" value="I'm interested in giving on a regular basis.">I'm interested in giving on
                a regular basis.
            </td>
        </tr>

        <tr>
            <td></td>
            <td><label for="monthly credit card"> monthly credit card$</label>
            <td> <input type="number" id="monthly credit card" required>

            </td>




    </table>

</body>

</html>
